name: FastDecimal CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (GCC)
            os: ubuntu-24.04
          - name: Linux aarch64 (NEON)
            os: ubuntu-24.04-arm
          - name: macOS ARM64 (Apple Silicon NEON)
            os: macos-14

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java (JDK 22+ for Panama)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Library, Shared Library, Tests & Benchmarks
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Fix macOS dylib install name
        if: runner.os == 'macOS'
        run: |
          install_name_tool -id @rpath/libfastdecimal.dylib build/libfastdecimal.dylib || true

      - name: Run C++ Unit Tests
        run: ./build/tests

      - name: Run C++ Benchmark
        run: ./build/bench

      - name: Test Rust Interop
        run: |
          cd interop/rust
          mkdir -p target/debug/deps
          if [ -f ../../build/libfastdecimal.dylib ]; then
            cp ../../build/libfastdecimal.dylib target/debug/
            cp ../../build/libfastdecimal.dylib target/debug/deps/
          fi
          if [ -f ../../build/libfastdecimal.so ]; then
            cp ../../build/libfastdecimal.so target/debug/
            cp ../../build/libfastdecimal.so target/debug/deps/
          fi
          export FASTDECIMAL_LIB_DIR="$(cd ../../build && pwd)"
          export LD_LIBRARY_PATH="$(cd ../../build && pwd):${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$(cd ../../build && pwd):${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="$(cd ../../build && pwd):${DYLD_FALLBACK_LIBRARY_PATH:-}"
          cargo test -- --nocapture

      - name: Test Java Project Panama Interop
        run: |
          cd interop/java
          javac com/fastdecimal/FastDecimal.java TestPanama.java
          BUILD_DIR="$(cd ../../build && pwd)"
          java --enable-native-access=ALL-UNNAMED \
               -Djava.library.path="$BUILD_DIR" \
               -Dfastdecimal.lib.path="$BUILD_DIR/libfastdecimal.so" \
               -cp . TestPanama || \
          java --enable-native-access=ALL-UNNAMED \
               -Djava.library.path="$BUILD_DIR" \
               -Dfastdecimal.lib.path="$BUILD_DIR/libfastdecimal.dylib" \
               -cp . TestPanama

      - name: Test C# Interop
        run: |
          cd interop/csharp
          BUILD_DIR="$(cd ../../build && pwd)"
          export LD_LIBRARY_PATH="$BUILD_DIR:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$BUILD_DIR:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="$BUILD_DIR:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          dotnet run
